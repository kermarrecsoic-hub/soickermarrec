[build]
  publish = "public"
  functions = "netlify/functions"
  # Nur neu deployen, wenn sich wirklich Studio-Code/-Konfiguration ändert.
  # Content-Commits aus dem Studio (data/, images/, share/) sollen keinen
  # neuen Netlify-Deploy auslösen. Exit 0 = Build überspringen.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://soickermarrec.de blob: data:; connect-src 'self'; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
